[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "writer-agent"
version = "0.1.0"
description = "A LangGraph-based multi-agent research and writing workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core==1.5.0",
    "langchain-groq==1.1.3",
    "langgraph==1.2.9",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "tavily-python==0.7.26",
]

[tool.setuptools.packages.find]
where = ["src"]
